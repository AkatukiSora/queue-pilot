name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "deploy/app/overlays/prod/kustomization.yaml"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish images and print-agent artifacts
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      app_digest: ${{ steps.app-registry-digest.outputs.digest }}
      migrate_digest: ${{ steps.migrate-registry-digest.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache-dependency-path: apps/print-agent/go.sum
      - name: Build print-agent binaries for Linux amd64 and arm64
        working-directory: apps/print-agent
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist/print-agent"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o "$GITHUB_WORKSPACE/dist/print-agent/print-agent-linux-amd64" ./cmd/print-agent
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o "$GITHUB_WORKSPACE/dist/print-agent/print-agent-linux-arm64" ./cmd/print-agent
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: print-agent-${{ github.sha }}
          path: dist/print-agent/
          if-no-files-found: error
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # One timestamp tag is generated for both images. Its string order follows
      # build time, so an alphabetical update strategy selects the newest build.
      - name: Generate release tag
        id: release-tag
        run: |
          set -euo pipefail
          tag="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          if [[ ! "$tag" =~ ^[0-9]{14}-[0-9a-f]{7}$ ]]; then
            printf 'Generated release tag is malformed: %s\n' "$tag" >&2
            exit 1
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
      # The migration image is published before the application image.
      - name: Publish migration image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.migrate
          push: true
          tags: |
            ghcr.io/akatukisora/queue-pilot-migrate:${{ github.sha }}
            ghcr.io/akatukisora/queue-pilot-migrate:${{ steps.release-tag.outputs.tag }}
      # Read the pushed GHCR manifest digest back with imagetools. The action's
      # local Buildx digest is not assumed to equal the registry manifest digest.
      - name: Read migration image digest from GHCR
        id: migrate-registry-digest
        env:
          IMAGE: ghcr.io/akatukisora/queue-pilot-migrate
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA" --format '{{json .Manifest}}' | jq -er '.digest')
          tagged=$(docker buildx imagetools inspect "$IMAGE:$RELEASE_TAG" --format '{{json .Manifest}}' | jq -er '.digest')
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf '%s\n' 'GHCR did not return a valid migration manifest digest.' >&2
            exit 1
          fi
          if [[ "$digest" != "$tagged" ]]; then
            printf '%s\n' 'The migration SHA tag and release tag point to different digests.' >&2
            exit 1
          fi
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Publish application image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/akatukisora/queue-pilot:${{ github.sha }}
            ghcr.io/akatukisora/queue-pilot:${{ steps.release-tag.outputs.tag }}
      - name: Read application image digest from GHCR
        id: app-registry-digest
        env:
          IMAGE: ghcr.io/akatukisora/queue-pilot
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA" --format '{{json .Manifest}}' | jq -er '.digest')
          tagged=$(docker buildx imagetools inspect "$IMAGE:$RELEASE_TAG" --format '{{json .Manifest}}' | jq -er '.digest')
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf '%s\n' 'GHCR did not return a valid application manifest digest.' >&2
            exit 1
          fi
          if [[ "$digest" != "$tagged" ]]; then
            printf '%s\n' 'The application SHA tag and release tag point to different digests.' >&2
            exit 1
          fi
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

  prepare-manifest:
    name: Prepare digest-pinned manifest
    runs-on: ubuntu-24.04
    needs: publish
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: kustomize
      - name: Replace both placeholder digests with the pushed image digests
        working-directory: deploy/app/overlays/prod
        env:
          APP_DIGEST: ${{ needs.publish.outputs.app_digest }}
          MIGRATE_DIGEST: ${{ needs.publish.outputs.migrate_digest }}
        run: |
          if [[ ! "$APP_DIGEST" =~ ^sha256:[0-9a-f]{64}$ || ! "$MIGRATE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf '%s\n' 'GHCR returned an invalid image digest.' >&2
            exit 1
          fi
          mise exec -- kustomize edit set image "ghcr.io/akatukisora/queue-pilot=ghcr.io/akatukisora/queue-pilot@$APP_DIGEST"
          mise exec -- kustomize edit set image "ghcr.io/akatukisora/queue-pilot-migrate=ghcr.io/akatukisora/queue-pilot-migrate@$MIGRATE_DIGEST"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prod-digest-manifest-${{ github.sha }}
          path: deploy/app/overlays/prod/kustomization.yaml
          if-no-files-found: error
          retention-days: 1
