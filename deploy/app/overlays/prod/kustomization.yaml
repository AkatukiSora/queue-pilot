apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ingress.yaml
# TEMPORARY, for measurement only: a deliberately high CPU limit so the
# Kyverno requests/limits audit is satisfied while real CPU usage and
# throttling are measured under load. Replace it with a measured value.
patches:
  - target:
      kind: Deployment
      name: bunkasai-ticket
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1"
