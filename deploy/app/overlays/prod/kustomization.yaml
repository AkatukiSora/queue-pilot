apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ingress.yaml
# API CPU limit chosen from a stepped load test through port-forward (read-only
# public-ticket polling, 10 to 400 simulated clients, about 2 to 80 requests per
# second). Peak CPU was about 40m at 80 requests per second with no CFS
# throttling, so 300m leaves roughly a seven-fold margin for write paths and
# admin polling, which the test did not exercise. Revisit it after measuring them.
patches:
  - target:
      kind: Deployment
      name: bunkasai-ticket
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 300m
  # Database configuration authority and gated self-service registration. Authority
  # was handed to the database by a one-time adoption, so the API runs with
  # TENANT_CONFIG_SOURCE=database. Registration is limited to the numeric GitHub
  # account IDs listed below.
  - target:
      kind: Deployment
      name: bunkasai-ticket
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: TENANT_CONFIG_SOURCE
          value: database
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: TENANT_SIGNUP_ENABLED
          value: "true"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: TENANT_SIGNUP_POLICY
          value: allowlist
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: TENANT_SIGNUP_GITHUB_IDS
          value: '["80885196"]'
images:
  # Both image digests are from Release run 44418603128 for source 57ed3f3a0ab814710be5516cf51485de8037ed49.
  - name: ghcr.io/akatukisora/queue-pilot
    newName: ghcr.io/akatukisora/queue-pilot
    digest: sha256:65903836f27629ac38654f682bdacffc3ff90e471d14cfdeb4ae3e5c04e5fc70
  - name: ghcr.io/akatukisora/queue-pilot-migrate
    newName: ghcr.io/akatukisora/queue-pilot-migrate
    digest: sha256:566c1a5a2d4e660eda35c352281816e13fb1f60ff7d8577252eb0eec1602d46d
