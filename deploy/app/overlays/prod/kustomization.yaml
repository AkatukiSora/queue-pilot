apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ingress.yaml
  - adopt-job.yaml
# API CPU limit chosen from a stepped load test through port-forward (read-only
# public-ticket polling, 10 to 400 simulated clients, about 2 to 80 requests per
# second). Peak CPU was about 40m at 80 requests per second with no CFS
# throttling, so 300m leaves roughly a seven-fold margin for write paths and
# admin polling, which the test did not exercise. Revisit it after measuring them.
patches:
  - target:
      kind: Deployment
      name: bunkasai-ticket
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 300m
  # Database configuration authority and gated self-service registration. The
  # one-time adopt Job in adopt-job.yaml hands authority to the database, and the
  # API must then run with TENANT_CONFIG_SOURCE=database. Registration is limited
  # to the numeric GitHub account IDs listed below.
  - target:
      kind: Deployment
      name: bunkasai-ticket
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: TENANT_CONFIG_SOURCE
          value: database
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: TENANT_SIGNUP_ENABLED
          value: "true"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: TENANT_SIGNUP_POLICY
          value: allowlist
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: TENANT_SIGNUP_GITHUB_IDS
          value: '["80885196"]'
images:
  # Both image digests are from Release run 44234128103 for source 1565c34f06edcd98a09da52572e5d61d043f5b79.
  - name: ghcr.io/akatukisora/queue-pilot
    newName: ghcr.io/akatukisora/queue-pilot
    digest: sha256:9a53f4206c3888ef60a2f047a2fd8d5d5bb2fe88fd9926ea99958a43c005909d
  - name: ghcr.io/akatukisora/queue-pilot-migrate
    newName: ghcr.io/akatukisora/queue-pilot-migrate
    digest: sha256:dc4df7670c11839e90b1556244461caf6e9433d348d6472ec04717e3cf7a1b70
