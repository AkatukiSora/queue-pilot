apiVersion: apps/v1
kind: Deployment
metadata:
  name: bunkasai-ticket
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/name: bunkasai-ticket
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bunkasai-ticket
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bunkasai-ticket
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: ghcr.io/akatukisora/queue-pilot:unconfigured
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8787
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bunkasai-ticket-postgres-app
                  key: uri
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bunkasai-ticket-secrets
                  key: ADMIN_TOKEN
            - name: AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bunkasai-ticket-secrets
                  key: AGENT_TOKEN
            - name: EVENT_END_AT
              value: "2026-11-04T14:00:00+09:00"
            - name: TICKET_NUMBER_SCOPE
              value: daily
          startupProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/readyz
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
