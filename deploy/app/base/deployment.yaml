apiVersion: apps/v1
kind: Deployment
metadata:
  name: bunkasai-ticket
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/name: bunkasai-ticket
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bunkasai-ticket
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bunkasai-ticket
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: ghcr.io/akatukisora/queue-pilot:unconfigured
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8787
              protocol: TCP
          env:
            - name: AUTH_MODE
              value: oidc/shared
            - name: AUTH_PROVIDER
              value: github
            - name: PUBLIC_BASE_URL
              value: https://queue-pilot.sora-lab.dev
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: bunkasai-ticket-secrets
                  key: AUTH_SECRET
                  optional: false
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: bunkasai-ticket-secrets
                  key: GITHUB_CLIENT_ID
                  optional: false
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bunkasai-ticket-secrets
                  key: GITHUB_CLIENT_SECRET
                  optional: false
            - name: APP_MANIFEST_PATH
              value: /etc/queue-pilot/tenant-manifest.json
            - name: DB_HOST
              value: bunkasai-ticket-postgres-rw.bunkasai-ticket.svc
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: app
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: bunkasai-ticket-runtime-db
                  key: username
                  optional: false
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bunkasai-ticket-runtime-db
                  key: password
                  optional: false
            - name: DB_SSLMODE
              value: verify-full
            - name: DB_SSLROOTCERT
              value: /etc/queue-pilot/postgres-ca/ca.crt
          volumeMounts:
            - name: tenant-manifest
              mountPath: /etc/queue-pilot/tenant-manifest.json
              subPath: tenant-manifest.json
              readOnly: true
            - name: postgres-ca
              mountPath: /etc/queue-pilot/postgres-ca
              readOnly: true
          startupProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/readyz
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: tenant-manifest
          secret:
            secretName: bunkasai-ticket-secrets
            optional: false
            defaultMode: 0444
            items:
              - key: TENANT_MANIFEST_JSON
                path: tenant-manifest.json
        - name: postgres-ca
          secret:
            secretName: bunkasai-ticket-postgres-ca
            optional: false
            defaultMode: 0444
            items:
              - key: ca.crt
                path: ca.crt
