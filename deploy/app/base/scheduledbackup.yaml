apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: bunkasai-ticket-postgres-barman-daily
  namespace: bunkasai-ticket
spec:
  schedule: "0 40 1 * * *"
  suspend: false
  backupOwnerReference: self
  cluster:
    name: bunkasai-ticket-postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
