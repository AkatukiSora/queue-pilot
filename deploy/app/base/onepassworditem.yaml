# Replace the path with the existing 1Password item before syncing this resource.
# The item must contain fields named ADMIN_TOKEN and AGENT_TOKEN; secret values stay in 1Password.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: bunkasai-ticket-secrets
  namespace: bunkasai-ticket
  annotations:
    operator.1password.io/auto-restart: "true"
spec:
  itemPath: "vaults/<vault-id>/items/<item-id>"
