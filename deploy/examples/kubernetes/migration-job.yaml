apiVersion: batch/v1
kind: Job
metadata:
  name: queue-pilot-migrate
  labels:
    app.kubernetes.io/name: queue-pilot
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: queue-pilot
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: queue-pilot-migrate:sample
          imagePullPolicy: IfNotPresent
          args:
            - migrate
            - apply
            - --dir
            - file:///migrations
            - --url
            - $(MIGRATION_DATABASE_URL)
          env:
            - name: MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: queue-pilot-migration-db
                  key: url
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
