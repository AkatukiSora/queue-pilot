apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bunkasai-ticket-postgres-ingress
  namespace: bunkasai-ticket
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: bunkasai-ticket-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bunkasai-ticket
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bunkasai-ticket
              app.kubernetes.io/component: migration
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 5432
